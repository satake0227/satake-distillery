    <div class="contact">
        <div class="name">
            <h3>お名前
                <span class="required">必須</span>
            </h3>
            <input type="text" name="name" class="name-input" placeholder="山田 太郎" required>
        </div>
        <div class="mail">
            <h3>メールアドレス
                <span class="required">必須</span>
            </h3>
            <input type="text" mail="mail" class="mail-input" placeholder="〇〇〇〇＠〇〇〇〇" required>
        </div>
        <div class="message">
            <h3>お問い合わせ内容
                <span class="required">必須</span>
            </h3>
            <textarea
                    name="message"
                    class="message-input"
                    placeholder="お問い合わせ内容をご入力ください"
                    required
            ></textarea>
        </div>
    </div>
    <label class="privacy-check">
        <input type="checkbox">
            <span><span class="highlight">個人情報の取扱いに関する同意事項</span>に同意します。</span>
